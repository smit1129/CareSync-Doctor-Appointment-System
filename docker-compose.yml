version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: doctor_appointment_backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=super-secret-production-key-2026-doctor-mgmt
      - DATABASE_URL=sqlite:///./doctor_appointments.db
      - SUPABASE_URL=
      - SUPABASE_ANON_KEY=
      - SUPABASE_SERVICE_ROLE_KEY=
    restart: unless-stopped
    volumes:
      - ./backend_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: doctor_appointment_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000/api
    depends_on:
      - backend
    restart: unless-stopped
